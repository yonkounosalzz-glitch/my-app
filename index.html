<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitsal | Financial Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-hover: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #3b82f6; 
            --income: #22c55e; 
            --expense: #ef4444; 
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 20px 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 1.4rem; font-weight: 700; }
        .header h1 span { color: var(--accent); }
        .date-today { color: var(--text-secondary); font-size: 0.85rem; }

        .balance-card {
            background: linear-gradient(135deg, var(--bg-card), #131316);
            border: 1px solid var(--border);
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .balance-card p { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 5px; }
        .balance-card h2 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.5px; }

        .form-section {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .input-group { margin-bottom: 12px; }
        input, select {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); }

        .btn-submit {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg-main);
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-submit:active { transform: scale(0.98); }

        .table-section h3 { margin-bottom: 15px; font-size: 1.1rem; }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th { color: var(--text-secondary); font-weight: 500; }
        tbody tr:last-child td { border-bottom: none; }

        .td-income { color: var(--income); font-weight: 600; }
        .td-expense { color: var(--expense); font-weight: 600; }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .btn-delete:hover { color: var(--expense); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Money<span>Tracker</span>.</h1>
            <p class="date-today" id="current-date"></p>
        </header>

        <section class="balance-card">
            <p>Sisa Uang Saat Ini</p>
            <h2 id="total-balance">Rp 0</h2>
        </section>

        <section class="form-section">
            <form id="transaction-form">
                <div class="input-group">
                    <select id="type" required>
                        <option value="in">Pemasukan (+)</option>
                        <option value="out">Pengeluaran (-)</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="number" id="amount" placeholder="Nominal (Cth: 15000)" required min="1">
                </div>
                <div class="input-group">
                    <input type="text" id="reason" placeholder="Alasan / Keterangan" required autocomplete="off">
                </div>
                <button type="submit" class="btn-submit">Simpan Catatan</button>
            </form>
        </section>

        <section class="table-section">
            <h3>Riwayat Transaksi</h3>
            <div class="table-responsive">
                <table id="transaction-table">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Nominal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('moneyTracker')) || [];
        const form = document.getElementById('transaction-form');
        const balanceEl = document.getElementById('total-balance');
        const tableBody = document.getElementById('table-body');
        const dateTodayEl = document.getElementById('current-date');

        const today = new Date();
        dateTodayEl.textContent = today.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(number);
        }

        function updateUI() {
            tableBody.innerHTML = '';
            let totalBalance = 0;

            transactions.forEach(trx => {
                if (trx.type === 'in') {
                    totalBalance += trx.amount;
                } else {
                    totalBalance -= trx.amount;
                }

                const tr = document.createElement('tr');
                const isIncome = trx.type === 'in';
                const nominalText = isIncome ? `+ ${formatRupiah(trx.amount)}` : `- ${formatRupiah(trx.amount)}`;
                const colorClass = isIncome ? 'td-income' : 'td-expense';

                tr.innerHTML = `
                    <td>${trx.date}</td>
                    <td>${trx.reason}</td>
                    <td class="${colorClass}">${nominalText}</td>
                    <td><button class="btn-delete" onclick="deleteTransaction(${trx.id})">&times;</button></td>
                `;
                tableBody.appendChild(tr);
            });

            balanceEl.textContent = formatRupiah(totalBalance);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.getElementById('type').value;
            const amount = parseInt(document.getElementById('amount').value);
            const reason = document.getElementById('reason').value;
            
            const d = new Date();
            const shortDate = `${d.getDate()}/${d.getMonth() + 1}`;

            const newTransaction = {
                id: Date.now(),
                type: type,
                amount: amount,
                reason: reason,
                date: shortDate
            };

            transactions.push(newTransaction);
            localStorage.setItem('moneyTracker', JSON.stringify(transactions));
            
            form.reset();
            document.getElementById('type').value = 'in';
            updateUI();
        });

        window.deleteTransaction = function(id) {
            transactions = transactions.filter(trx => trx.id !== id);
            localStorage.setItem('moneyTracker', JSON.stringify(transactions));
            updateUI();
        };

        updateUI();
    </script>
</body>
</html>
